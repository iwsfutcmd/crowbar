[package]
name = "crowbar-shapers"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
harfrust = "0.13"
allsorts = { version = "0.17", default-features = false, features = ["flate2_rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
